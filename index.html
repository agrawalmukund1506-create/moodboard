<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lit light table. The masthead takes its glow and swatch strip from the
   board's own images; below it a sticky glass toolbar, then a shortest-column wall. */
:root {
  --bg: #ECEBE7;
  --surface: #F8F7F4;
  --tile: #DCDBD5;
  --fg: #191918;
  --muted: #6C6B66;
  --line: #D3D2CC;
  --accent: #2F56E0;
  --danger: #C2361F;
  --shadow: rgba(40, 34, 20, .30);
  --glass: rgba(236, 235, 231, .78);
  --ambient: .55;
  --grain: .06;
  --ill-1: #D9A47A; --ill-2: #7F9C8E; --ill-3: #34405E; --ill-4: #E9C46A; --ill-5: #B5524A;
  --a1: var(--ill-1); --a2: var(--ill-2); --a3: var(--ill-4);
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gap: 12px;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213; --surface: #1B1C1F; --tile: #222428; --fg: #EDEDEA; --muted: #8D8F94;
    --line: #2B2D31; --accent: #7C95FF; --danger: #FF7A63; --shadow: rgba(0, 0, 0, .65);
    --glass: rgba(17, 18, 19, .72); --ambient: .38; --grain: .07;
    --ill-1: #C98E63; --ill-2: #6E8B7D; --ill-3: #5A6A96; --ill-4: #D9B455; --ill-5: #B5524A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111213; --surface: #1B1C1F; --tile: #222428; --fg: #EDEDEA; --muted: #8D8F94;
  --line: #2B2D31; --accent: #7C95FF; --danger: #FF7A63; --shadow: rgba(0, 0, 0, .65);
  --glass: rgba(17, 18, 19, .72); --ambient: .38; --grain: .07;
  --ill-1: #C98E63; --ill-2: #6E8B7D; --ill-3: #5A6A96; --ill-4: #D9B455; --ill-5: #B5524A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  position: relative; isolation: isolate;
  background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--font-body);
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px));
  min-height: 100vh;
}
/* film grain */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- ambient glow from the board palette */
.ambient {
  position: absolute; inset: 0 0 auto; height: 560px; z-index: -1; pointer-events: none;
  opacity: var(--ambient);
  background:
    radial-gradient(38% 70% at 8% 10%, var(--a1), transparent 70%),
    radial-gradient(32% 60% at 48% -5%, var(--a2), transparent 70%),
    radial-gradient(40% 70% at 95% 15%, var(--a3), transparent 70%);
  filter: blur(50px) saturate(1.15);
  -webkit-mask-image: linear-gradient(#000 35%, transparent);
          mask-image: linear-gradient(#000 35%, transparent);
  transition: opacity .6s ease;
}

/* ---------- masthead */
.masthead { padding-block: 22px 18px; display: grid; gap: 14px; }
.mast-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.eyebrow .mark { display: inline-grid; grid-template-columns: repeat(2, 6px); gap: 2px; }
.eyebrow .mark i { width: 6px; height: 6px; border-radius: 1.5px; background: var(--a1); }
.eyebrow .mark i:nth-child(2) { background: var(--a2); }
.eyebrow .mark i:nth-child(3) { background: var(--a3); }
.eyebrow .mark i:nth-child(4) { background: var(--fg); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  height: 34px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--glass);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn .count { font: 500 11px var(--font-mono); color: var(--muted); }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }

#boardName {
  font: 800 clamp(40px, 7vw, 88px)/.95 var(--font-display);
  letter-spacing: -.035em;
  border: 0; background: transparent; padding: 0; margin: 4px 0 0;
  width: 100%; min-width: 0; outline: none; text-overflow: ellipsis;
}
#boardName::selection { background: var(--a1); }
.tally {
  font: 500 11.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap;
}
.tally b { color: var(--fg); font-weight: 500; }

/* palette strip */
.palette-wrap { display: grid; gap: 8px; margin-top: 4px; }
.palette-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.palette-head .lbl { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.palette-head button { border: 0; background: none; padding: 0; font: 500 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.palette-head button:hover { color: var(--fg); }
.palette {
  display: flex; height: 64px; border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -24px var(--shadow);
}
.sw {
  flex: var(--w) 1 0; min-width: 34px; border: 0; padding: 0 10px 9px; position: relative;
  display: flex; align-items: flex-end; justify-content: flex-start;
  font: 500 10.5px/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
  transition: flex-grow .5s cubic-bezier(.2,.8,.2,1);
}
.sw span { opacity: .85; white-space: nowrap; overflow: hidden; }
.sw:hover { flex-grow: calc(var(--w) + 6); }
.sw:hover span { opacity: 1; }
.palette.empty-pal { height: 10px; background: linear-gradient(90deg, var(--tile), var(--line)); box-shadow: none; }

/* ---------- sticky toolbar */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
  padding: 12px max(20px, env(safe-area-inset-left, 0px));
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid transparent; display: grid; gap: 10px;
  transition: border-color .2s;
}
.toolbar.stuck { border-bottom-color: var(--line); }
.adder {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 5px 5px 5px 14px;
  box-shadow: 0 10px 30px -22px var(--shadow);
  transition: border-color .15s, box-shadow .15s;
}
.adder:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.adder .plus { width: 18px; height: 18px; flex: none; color: var(--muted); }
#linkInput {
  flex: 1; min-width: 0; height: 38px; max-height: 140px; resize: none; border: 0; outline: none;
  background: transparent; padding: 9px 4px; font: 14px/1.4 var(--font-body);
}
#linkInput::placeholder { color: var(--muted); }
.kbd { font: 500 11px var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
#addBtn {
  border: 0; border-radius: 10px; height: 38px; padding: 0 18px;
  background: var(--fg); color: var(--bg); font-weight: 600;
}
#addBtn:disabled { opacity: .5; cursor: progress; }
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 28px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; font-size: 12.5px;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-family: var(--font-mono); font-size: 10.5px; opacity: .6; }
.chip .tagdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.spacer { flex: 1; }
.knob { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.knob select { height: 28px; border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 0 8px; font-size: 12.5px; color: var(--fg); }
.knob input { width: 90px; accent-color: var(--fg); }

/* ---------- wall */
#wall { display: flex; gap: var(--gap); align-items: flex-start; padding-top: 18px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.tile {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: var(--tile); cursor: zoom-in;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;
}
.tile:hover { transform: translateY(-3px); box-shadow: 0 22px 40px -20px var(--shadow); }
.tile img, .tile video { display: block; width: 100%; height: auto; transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .4s ease; }
.tile:hover img, .tile:hover video { transform: scale(1.025); }
.tile img.loading { opacity: 0; }
.tile.in { animation: tileIn .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes tileIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.tile.pending {
  aspect-ratio: 4 / 5; cursor: default;
  background: linear-gradient(100deg, var(--tile) 30%, color-mix(in srgb, var(--surface) 70%, var(--tile)) 50%, var(--tile) 70%) 0 0 / 300% 100%;
  animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer { to { background-position: -150% 0; } }
.tile.dragging { opacity: .3; }
.tile.drop-before { box-shadow: 0 -4px 0 0 var(--accent); }

.badge {
  position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
  font: 500 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
  background: rgba(10,10,10,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: #fff; padding: 6px 8px; border-radius: 999px; pointer-events: none; transition: opacity .15s;
}
.badge .live { width: 6px; height: 6px; border-radius: 50%; background: #FF5A4E; box-shadow: 0 0 0 3px rgba(255,90,78,.25); }
.play {
  position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%;
  background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.35);
  display: grid; place-items: center; pointer-events: none; transition: transform .25s;
}
.play::after { content: ""; margin-left: 4px; border-left: 15px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.tile:hover .play { transform: scale(1.08); }
.frame {
  position: absolute; left: 10px; top: 10px;
  font: 500 10.5px/1 var(--font-mono); color: #fff; background: rgba(10,10,10,.5);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 6px 7px; border-radius: 999px; opacity: 0; transition: opacity .15s; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.tools a, .tools button {
  width: 30px; height: 30px; border-radius: 50%; border: 0;
  background: rgba(10,10,10,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: #fff; display: grid; place-items: center; text-decoration: none; font-size: 13px; line-height: 1;
}
.tools button:hover { background: var(--danger); }
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 11px;
  background: linear-gradient(transparent, rgba(0,0,0,.78));
  color: #fff; font-size: 12.5px; line-height: 1.35;
  opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .25s; pointer-events: none;
}
.cap .tg { display: inline-block; font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; background: rgba(255,255,255,.18); margin-bottom: 6px; }
.cap p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .chipsw { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
.tile .chipsw i { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,.6); }
.tile:hover .tools, .tile:hover .frame, .tile:focus-within .tools, .tile:hover .chipsw { opacity: 1; }
.tile:hover .cap { opacity: 1; transform: none; }
.tile:hover .badge { opacity: 0; }

.linkcard {
  padding: 18px 16px 44px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); min-height: 120px; position: relative;
}
.linkcard .t { font: 600 15px/1.3 var(--font-display); word-break: break-word; }
.linkcard .h { color: var(--muted); font: 11.5px var(--font-mono); margin-top: 8px; word-break: break-all; }
.linkcard .badge { background: var(--tile); color: var(--muted); }

/* ---------- empty state art */
.empty {
  flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center;
  padding: 40px clamp(8px, 4vw, 48px); border-radius: 20px;
  border: 1.5px dashed var(--line);
}
.empty h2 { margin: 0 0 12px; font: 800 clamp(26px, 3.4vw, 40px)/1.02 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }
.empty p { margin: 0 0 18px; color: var(--muted); max-width: 52ch; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.sources span {
  font: 500 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--muted);
}
.art { position: relative; height: 320px; max-width: 460px; width: 100%; justify-self: center; }
.art .card {
  position: absolute; border-radius: 10px; overflow: hidden; background: var(--surface);
  box-shadow: 0 30px 50px -28px var(--shadow), 0 0 0 1px var(--line);
  animation: drift 7s ease-in-out infinite alternate;
}
@keyframes drift { to { translate: 0 -8px; } }
.art .c1 { width: 46%; height: 62%; left: 2%; top: 14%; rotate: -7deg; }
.art .c1 .scene { position: absolute; inset: 0; background:
  radial-gradient(circle at 70% 32%, var(--ill-4) 0 12%, transparent 12.5%),
  radial-gradient(120% 60% at 30% 110%, var(--ill-2) 0 45%, transparent 45.5%),
  radial-gradient(120% 70% at 90% 120%, color-mix(in srgb, var(--ill-2) 70%, #000) 0 50%, transparent 50.5%),
  linear-gradient(var(--ill-1), color-mix(in srgb, var(--ill-1) 55%, var(--ill-4))); }
.art .c2 { width: 44%; height: 40%; left: 40%; top: 4%; rotate: 5deg; animation-delay: -2s; background: var(--ill-3); }
.art .c2::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 80% at 30% 30%, color-mix(in srgb, var(--ill-5) 70%, transparent), transparent 70%); }
.art .c2 .pl { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); }
.art .c2 .pl::after { content: ""; position: absolute; left: 15px; top: 11px; border-left: 13px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.art .c2 .bar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); }
.art .c2 .bar::after { content: ""; position: absolute; inset: 0 55% 0 0; border-radius: 3px; background: #fff; }
.art .c3 { width: 42%; height: 44%; left: 52%; top: 46%; rotate: -3deg; animation-delay: -4s; padding: 10px; display: grid; grid-template-columns: 1.3fr 1fr 1fr; grid-auto-rows: 1fr; gap: 1px; background: var(--line); }
.art .c3 i { background: var(--surface); font: 500 8px/1 var(--font-mono); color: var(--muted); display: flex; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; font-style: normal; }
.art .c3 i.s { background: var(--c); }
.art .c4 { width: 30%; height: 18%; left: 18%; top: 78%; rotate: 8deg; animation-delay: -1s; display: flex; }
.art .c4 i { flex: 1; }
.art .tagline { position: absolute; right: 4%; top: 2%; font: 500 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); rotate: 90deg; transform-origin: right top; }

/* ---------- overlays */
#dropzone {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none;
}
.drop-card {
  display: grid; justify-items: center; gap: 10px; padding: 48px 64px; border-radius: 24px;
  border: 2px dashed var(--accent); background: var(--surface); text-align: center;
  box-shadow: 0 40px 80px -40px var(--shadow);
  animation: pop .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.drop-card b { font: 800 30px/1 var(--font-display); letter-spacing: -.02em; }
.drop-card span { color: var(--muted); }
.drop-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 30px; }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 90; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 999px;
  max-width: min(600px, calc(100vw - 32px)); font-size: 13px; box-shadow: 0 16px 40px -16px var(--shadow);
  display: flex; align-items: center; gap: 10px; animation: pop .2s ease;
}
#toast .sw-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--bg); }

/* boards sheet */
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; justify-content: flex-end; }
.sheet {
  width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -30px 0 60px -40px var(--shadow);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 22px 22px;
  display: grid; align-content: start; gap: 18px; animation: slide .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font: 800 28px/1 var(--font-display); letter-spacing: -.02em; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.bcard { border: 0; padding: 0; background: none; text-align: left; display: grid; gap: 8px; border-radius: 12px; }
.bcard .mosaic {
  aspect-ratio: 1; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  background: var(--tile); box-shadow: 0 0 0 1px var(--line); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
}
.bcard .mosaic img, .bcard .mosaic i { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--c, var(--tile)); }
.bcard:hover .mosaic { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--line), 0 20px 34px -20px var(--shadow); }
.bcard.current .mosaic { box-shadow: 0 0 0 2px var(--fg); }
.bcard b { font: 600 14px/1.2 var(--font-display); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .bm { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bcard small { font: 11px var(--font-mono); color: var(--muted); }
.bcard .dots { display: flex; }

const TAG_H = new Set(["tag", "tags", "group", "section", "category", "theme", "type", "mood"]);
const CAP_H = new Set(["caption", "note", "notes", "title", "description", "name", "label"]);

  for (const r of rows) {
    const urls = [], texts = []; let tag = "", caption = "";
    r.forEach((cell, i) => {
      cell = String(cell ?? "").trim();
      const found = cell.match(URL_RE);
      if (found) { urls.push(...found); return; }
      if (!cell) return;
      const col = header ? header[i] || "" : "";
      if (TAG_H.has(col) && !tag) tag = cell;
      else if (CAP_H.has(col) && !caption) caption = cell;

    const cb = "__moodSheet" + Date.now().toString(36);
    const s = document.createElement("script");
    const cleanup = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { cleanup(); rej(fail); }, 12000);

      if (!data || data.status === "error" || !data.table) return rej(fail);

  },
  async get(slug) { return lsGet("board:" + slug); },
  async put(slug, b) {

$("#lbPrev").onclick = () => stepLightbox(-1);
$("#lbNext").onclick = () => stepLightbox(1);
$("#lbClose").onclick = closeLightbox;
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lbStage") closeLightbox(); });
$("#lbCaption").addEventListener("input", e => {
  const it = state.items.find(x => x.id === lbId);
  if (it) { it.caption = e.target.value; save(); }
});

/* ---------------- controls */
async function copyText(text, msg, color) {
  try { await navigator.clipboard.writeText(text); toast(msg, color); }
  catch { toast("Couldn't reach the clipboard."); }
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-example]")) {
    if (state.name === "Untitled board") { state.name = "Example board"; $("#boardName").value = state.name; document.title = state.name + " · Moodboard"; }
    addLinks(EXAMPLES.join("\n"));
    return;
  }
  const sw = e.target.closest("[data-hex]");
  if (sw) copyText(sw.dataset.hex, `Copied ${sw.dataset.hex}`, sw.dataset.hex);
});
$("#copyPalette").onclick = () => {
  const pal = boardPalette().map(c => c.h);
  copyText(pal.join(", "), `Copied ${pal.length} colors.`, pal[0]);
};
document.addEventListener("keydown", e => {
  if (!$("#boardsPanel").hidden && e.key === "Escape") { $("#boardsPanel").hidden = true; return; }
  if ($("#lightbox").hidden || e.target.id === "lbCaption") return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") stepLightbox(1);
  if (e.key === "ArrowLeft") stepLightbox(-1);
});
$("#adder").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#linkInput").value.trim();
  if (!v) return;
  $("#linkInput").value = "";
  addLinks(v);
});
$("#linkInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#adder").requestSubmit(); }
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.filter = b.dataset.f;
  visible().forEach(it => fresh.add(it.id));
  render();
});
$("#cols").addEventListener("input", e => { state.cols = +e.target.value; render(); save(); });
$("#motion").addEventListener("change", e => { state.motion = e.target.value; render(); save(); });
$("#boardName").addEventListener("input", e => { state.name = e.target.value.trim() || "Untitled board"; document.title = state.name + " · Moodboard"; save(); });
$("#boardName").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#newBoard").onclick = newBoard;
$("#openBoards").onclick = () => { renderBoards(); $("#boardsPanel").hidden = false; };
$("#closeBoards").onclick = () => ($("#boardsPanel").hidden = true);
$("#boardsPanel").addEventListener("click", e => {
  if (e.target.id === "boardsPanel") { $("#boardsPanel").hidden = true; return; }
  const card = e.target.closest(".bcard");
  if (!card) return;
  if (card.dataset.new !== undefined) return newBoard();
  $("#boardsPanel").hidden = true;
  if (card.dataset.slug !== state.slug) openBoard(card.dataset.slug);
});
$("#copyLinks").onclick = () => {
  const links = state.items.map(it => it.url).filter(u => /^https?:/.test(u));
  copyText(links.join("\n"), `Copied ${links.length} links.`);
};
let delArmed = false;
$("#deleteBoard").onclick = async () => {
  const b = $("#deleteBoard");
  if (!delArmed) { delArmed = true; b.textContent = "Click again to delete"; setTimeout(() => { delArmed = false; b.textContent = "Delete this board"; }, 3000); return; }
  delArmed = false; b.textContent = "Delete this board";
  await api.del(state.slug);
  $("#boardsPanel").hidden = true;
  await refreshBoardList();
  if (boards.length) openBoard(boards[0].slug); else newBoard();
  toast("Board deleted. Files you dropped stay in the media folder.");
};
window.addEventListener("resize", relayoutSoon);
new IntersectionObserver(([e]) => $("#toolbar").classList.toggle("stuck", e.intersectionRatio === 0)).observe($(".masthead"));

/* ---------------- paste & drop anywhere */
document.addEventListener("paste", e => {
  if (e.target.closest("input, textarea")) {
    if (e.target.id !== "linkInput" || !e.clipboardData.files.length) return;
  }
  if (e.clipboardData.files.length) { e.preventDefault(); uploadFiles(e.clipboardData.files); return; }
  const text = e.clipboardData.getData("text");
  URL_RE.lastIndex = 0;
  if (URL_RE.test(text)) { e.preventDefault(); addLinks(text); }
  URL_RE.lastIndex = 0;
});
let dragDepth = 0;
const external = e => !e.dataTransfer.types.includes("application/x-mood-id");
document.addEventListener("dragenter", e => { if (!external(e)) return; dragDepth++; $("#dropzone").hidden = false; });
document.addEventListener("dragleave", e => { if (!external(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#dropzone").hidden = true; } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0; $("#dropzone").hidden = true;
  if (!external(e)) return;
  const dt = e.dataTransfer;
  if (dt.files.length) return uploadFiles(dt.files);
  const htmlData = dt.getData("text/html");
  const img = htmlData && htmlData.match(/<img[^>]+src=["']([^"']+)["']/i);
  if (img && /^https?:/.test(img[1])) return addLinks(img[1].replace(/&amp;/g, "&"));
  const text = dt.getData("text/uri-list") || dt.getData("text/plain");
  if (text) addLinks(text);
});

/* ---------------- boot */
(async function boot() {
  try {
    const list = await serverAPI.list();
    if (!Array.isArray(list)) throw new Error("no server");
  } catch {
    // No server.py behind this page (GitHub Pages, or opened as a file): work in the browser alone
    STATIC = true;
    api = staticAPI;
    $("#storageNote").textContent = "Boards save in this browser only. Run the local version to save them as files and read Pinterest-style links.";
  }
  await refreshBoardList();
  const last = store.get("moodboard:last");
  if (boards.some(b => b.slug === last)) openBoard(last);
  else if (boards.length) openBoard(boards[0].slug);
  else newBoard();
})();
</script>
</body>
</html>
