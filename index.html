<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodboard</title>
<script>try { const t = localStorage.getItem("moodboard:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a sketchbook page. Everything the app draws is ink on paper (black on white,
   or chalk on black in dark mode); only the references themselves carry color. Boxes get
   uneven "hand-drawn" corners, a hard offset shadow and the odd second stroke. */
:root {
  --bg: #FFFFFF;
  --fg: #111111;
  --muted: #5C5C5C;
  --faint: #E2E2E2;
  --wash: #F2F2F2;
  --tile: var(--wash);
  --line: var(--fg);
  --font-display: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hand: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
  --gap: 18px;
  --wob1: 255px 15px 225px 15px / 15px 225px 15px 255px;
  --wob2: 15px 255px 15px 225px / 225px 15px 255px 15px;
  --wob-dot: 58% 42% 52% 48% / 46% 56% 44% 54%;
  --hatch: repeating-linear-gradient(45deg, var(--faint) 0 2.5px, transparent 2.5px 8.485px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F0F; --fg: #F3F3EF; --muted: #A2A2A0; --faint: #2B2B2B; --wash: #1A1A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F0F; --fg: #F3F3EF; --muted: #A2A2A0; --faint: #2B2B2B; --wash: #1A1A1A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: radial-gradient(var(--faint) 1.2px, transparent 1.6px) 0 0 / 24px 24px fixed, var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font-hand);
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px));
  min-height: 100vh;
}
::selection { background: var(--fg); color: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px dashed var(--fg); outline-offset: 3px; }
.ink-svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }

/* a second, slightly-off pencil stroke around a box */
.sketch { position: relative; }
.sketch::before {
  content: ""; position: absolute; inset: -4px -2px -3px -5px; pointer-events: none;
  border: 1.5px solid var(--fg); border-radius: var(--wob2); opacity: .5; rotate: -.5deg;
}

/* ---------- masthead */
.masthead { padding-block: 24px 18px; display: grid; gap: 12px; }
.mast-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 700 17px/1 var(--font-display); letter-spacing: -.01em; }
.eyebrow svg { width: 22px; height: 22px; rotate: -12deg; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  height: 38px; padding: 0 16px; border: 2px solid var(--fg); border-radius: var(--wob1);
  background: var(--bg); box-shadow: 2px 3px 0 var(--fg);
  display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translate(-1px, -1px) rotate(-1deg); box-shadow: 3px 4px 0 var(--fg); }
.btn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--fg); }
.btn .count { font-size: 12.5px; color: var(--muted); }
.btn.solid { background: var(--fg); color: var(--bg); }
.btn.solid .count { color: inherit; }
.btn svg { width: 18px; height: 18px; flex: none; }

.title-wrap { display: grid; justify-items: start; }
#boardName {
  font: 800 clamp(44px, 7.5vw, 96px)/1.05 var(--font-display); letter-spacing: -.045em;
  border: 0; background: transparent; padding: 0; margin: 6px 0 0;
  width: 100%; min-width: 0; outline: none; text-overflow: ellipsis;
}
.scribble { width: min(380px, 70%); height: 18px; margin-top: -8px; }
.tally { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 15px; }
.tally b { color: var(--fg); font-weight: 700; }

/* palette strip: the swatches are the board's real colors, framed in ink */
.palette-wrap { display: grid; gap: 8px; margin-top: 6px; }
.palette-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.palette-head .lbl { color: var(--muted); font-size: 14px; }
.palette-head button { border: 0; background: none; padding: 0; font-size: 14px; font-weight: 600; text-decoration: underline wavy; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.palette {
  display: flex; height: 64px; overflow: hidden;
  border: 2px solid var(--fg); border-radius: var(--wob2); box-shadow: 3px 4px 0 var(--fg);
}
.sw {
  flex: var(--w) 1 0; min-width: 34px; border: 0; padding: 0 10px 8px; position: relative;
  display: flex; align-items: flex-end; justify-content: flex-start;
  font: 600 12px/1 var(--font-hand); text-transform: uppercase;
  transition: flex-grow .5s cubic-bezier(.2,.8,.2,1);
}
.sw + .sw { border-left: 2px solid var(--fg); }
.sw span { opacity: .85; white-space: nowrap; overflow: hidden; }
.sw:hover { flex-grow: calc(var(--w) + 6); }
.sw:hover span { opacity: 1; }
.palette.empty-pal { height: 14px; background: var(--hatch); box-shadow: none; border-width: 1.5px; }

/* ---------- sticky toolbar */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
  padding: 12px max(20px, env(safe-area-inset-left, 0px)) 14px;
  background: radial-gradient(var(--faint) 1.2px, transparent 1.6px) 0 0 / 24px 24px fixed, var(--bg);
  display: grid; gap: 12px;
}
.toolbar::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; opacity: 0; transition: opacity .2s;
  background: var(--fg);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='8'><path d='M0 4 Q10 0 20 4 T40 4' fill='none' stroke='black' stroke-width='1.8'/></svg>") 0 0 / 40px 8px repeat-x;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='8'><path d='M0 4 Q10 0 20 4 T40 4' fill='none' stroke='black' stroke-width='1.8'/></svg>") 0 0 / 40px 8px repeat-x;
}
.toolbar.stuck::after { opacity: 1; }
.adder {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 2px solid var(--fg); border-radius: var(--wob1);
  padding: 6px 6px 6px 14px; box-shadow: 3px 4px 0 var(--fg);
  transition: box-shadow .15s, transform .15s;
}
.adder:focus-within { box-shadow: 5px 6px 0 var(--fg); transform: translate(-1px, -1px); }
.adder .plus { width: 22px; height: 22px; flex: none; }
#linkInput {
  flex: 1; min-width: 0; height: 40px; max-height: 140px; resize: none; border: 0; outline: none;
  background: transparent; padding: 9px 4px; font: 15px/1.45 var(--font-hand);
}
#linkInput::placeholder { color: var(--muted); }
.kbd { font-size: 13px; color: var(--muted); border: 1.5px solid var(--muted); border-radius: var(--wob2); padding: 1px 7px; }
#addBtn {
  border: 2px solid var(--fg); border-radius: var(--wob2); height: 40px; padding: 0 20px;
  background: var(--fg); color: var(--bg); font: 700 15px var(--font-display);
  transition: transform .12s;
}
#addBtn:hover { transform: rotate(-2deg) scale(1.03); }
#addBtn:disabled { opacity: .5; cursor: progress; }
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  height: 32px; padding: 0 13px; border: 1.5px solid var(--fg); border-radius: var(--wob2);
  background: var(--bg); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px; transition: transform .12s;
}
.chip:nth-child(even) { border-radius: var(--wob1); }
.chip:hover { transform: rotate(-1.5deg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip .n { font-size: 12px; opacity: .65; }
.chip .tagdot { width: 9px; height: 9px; border: 1.5px solid currentColor; border-radius: var(--wob-dot); }
.spacer { flex: 1; }
.knob { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.knob select { height: 32px; border: 1.5px solid var(--fg); border-radius: var(--wob1); background: var(--bg); padding: 0 8px; font-size: 14px; color: var(--fg); }
.knob input { width: 96px; accent-color: var(--fg); }

/* ---------- wall: references pinned up, slightly askew */
#wall { display: flex; gap: var(--gap); align-items: flex-start; padding-top: 22px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
.tile {
  position: relative; overflow: hidden; background: var(--bg); cursor: zoom-in;
  border: 2px solid var(--fg); border-radius: var(--wob1); box-shadow: 3px 4px 0 var(--fg);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, rotate .25s ease;
}
.col .tile:nth-child(3n+1) { rotate: -.7deg; }
.col .tile:nth-child(3n+2) { rotate: .6deg; border-radius: var(--wob2); }
.col:nth-child(even) .tile:nth-child(3n) { rotate: .4deg; }
.tile:hover { rotate: 0deg; transform: translate(-2px, -3px); box-shadow: 6px 8px 0 var(--fg); }
.tile img, .tile video { display: block; width: 100%; height: auto; transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .4s ease; }
.tile:hover img, .tile:hover video { transform: scale(1.025); }
.tile img.loading { opacity: 0; }
.tile.in { animation: tileIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes tileIn { from { opacity: 0; transform: translateY(16px) rotate(3deg) scale(.96); } }
.tile.pending {
  aspect-ratio: 4 / 5; cursor: default; display: grid; place-items: center;
  background: var(--hatch), var(--bg); animation: sketching 1s linear infinite;
}
.tile.pending::after { content: "sketching…"; font-size: 15px; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: var(--wob1); }
@keyframes sketching { to { background-position: 12px 0, 0 0; } }
.tile.dragging { opacity: .3; }
.tile.drop-before { outline: 3px dashed var(--fg); outline-offset: 6px; }

.badge {
  position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
  font: 600 12.5px/1 var(--font-hand);
  background: var(--bg); color: var(--fg); border: 1.5px solid var(--fg); border-radius: var(--wob1);
  padding: 5px 9px; rotate: -2deg; pointer-events: none; transition: opacity .15s;
}
.badge .live { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.play {
  position: absolute; inset: 0; margin: auto; width: 58px; height: 58px;
  background: var(--bg); border: 2px solid var(--fg); border-radius: var(--wob-dot);
  box-shadow: 2px 3px 0 var(--fg);
  display: grid; place-items: center; pointer-events: none; transition: transform .25s;
}
.play::after { content: ""; margin-left: 5px; border-left: 16px solid var(--fg); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
.tile:hover .play { transform: scale(1.08) rotate(-6deg); }
.frame {
  position: absolute; left: 10px; top: 10px; font: 600 12.5px/1 var(--font-hand);
  color: var(--fg); background: var(--bg); border: 1.5px solid var(--fg); border-radius: var(--wob-dot);
  padding: 6px 7px; opacity: 0; transition: opacity .15s; pointer-events: none; font-variant-numeric: tabular-nums;
}
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 5px; opacity: 0; transition: opacity .15s; }
.tools a, .tools button {
  width: 32px; height: 32px; border: 1.5px solid var(--fg); border-radius: var(--wob-dot);
  background: var(--bg); color: var(--fg); display: grid; place-items: center; text-decoration: none; font-size: 14px; line-height: 1;
}
.tools a:hover, .tools button:hover { background: var(--fg); color: var(--bg); }
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 9px 12px 11px;
  background: var(--bg); border-top: 2px solid var(--fg); color: var(--fg); font-size: 13.5px; line-height: 1.35;
  opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .25s; pointer-events: none;
}
.cap .tg { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--fg); margin-bottom: 4px; }
.cap p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .chipsw { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
.tile .chipsw i { width: 12px; height: 12px; border-radius: var(--wob-dot); border: 1.5px solid var(--fg); }
.tile:hover .tools, .tile:hover .frame, .tile:focus-within .tools, .tile:hover .chipsw { opacity: 1; }
.tile:hover .cap { opacity: 1; transform: none; }
.tile:hover .badge { opacity: 0; }
.tile:has(.cap) .chipsw { display: none; }

.linkcard {
  padding: 18px 16px 50px; min-height: 120px; position: relative;
  background: linear-gradient(var(--bg), var(--bg)) 0 0 / 100% calc(100% - 40px) no-repeat, var(--hatch), var(--bg);
}
.linkcard .t { font: 700 16px/1.3 var(--font-display); word-break: break-word; }
.linkcard .h { color: var(--muted); font-size: 13px; margin-top: 8px; word-break: break-all; }

/* ---------- empty state */
.empty {
  flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center;
  padding: 36px clamp(16px, 4vw, 48px) 40px; background: var(--bg);
  border: 2.5px dashed var(--fg); border-radius: var(--wob2);
}
.empty h2 { margin: 0 0 14px; font: 800 clamp(28px, 3.4vw, 42px)/1.05 var(--font-display); letter-spacing: -.035em; text-wrap: balance; }
.empty h2 u { text-decoration: underline wavy; text-decoration-thickness: 2px; text-underline-offset: 8px; }
.empty p { margin: 0 0 20px; color: var(--muted); max-width: 50ch; }
.art { width: 100%; max-width: 470px; justify-self: center; color: var(--fg); }
.art .fill { fill: var(--bg); }
.art .solid { fill: currentColor; }
.art .tape { fill: var(--wash); stroke-width: 1.4; }
.art .thin { stroke-width: 1.4; }
.art .float { animation: float 6s ease-in-out infinite alternate; }
.art .float.b { animation-delay: -2s; }
.art .float.c { animation-delay: -4s; }
@keyframes float { to { transform: translateY(-7px); } }

/* ---------- overlays */
#dropzone {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); pointer-events: none;
}
.drop-card {
  display: grid; justify-items: center; gap: 12px; padding: 44px 64px; text-align: center;
  border: 3px dashed var(--fg); border-radius: var(--wob1); background: var(--bg);
  box-shadow: 6px 8px 0 var(--fg); rotate: -1.5deg;
  animation: pop .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.drop-card b { font: 800 36px/1 var(--font-display); letter-spacing: -.03em; }
.drop-card span { color: var(--muted); font-size: 15px; }
.drop-icon { width: 64px; height: 64px; border: 2.5px solid var(--fg); border-radius: var(--wob-dot); display: grid; place-items: center; font: 400 38px/1 var(--font-display); }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-.6deg);
  z-index: 90; background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: var(--wob1);
  max-width: min(600px, calc(100vw - 32px)); font-size: 14.5px; font-weight: 500;
  display: flex; align-items: center; gap: 10px; animation: pop .2s ease;
}
#toast .sw-dot { width: 16px; height: 16px; border-radius: var(--wob-dot); flex: none; border: 2px solid var(--bg); }

/* boards sheet */
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 65%, transparent); display: flex; justify-content: flex-end; }
.sheet {
  width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--bg);
  border-left: 2.5px solid var(--fg); box-shadow: -6px 0 0 var(--fg);
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 22px 24px;
  display: grid; align-content: start; gap: 20px; animation: slide .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font: 800 32px/1 var(--font-display); letter-spacing: -.03em; }
.icon-btn { width: 40px; height: 40px; border: 2px solid var(--fg); border-radius: var(--wob-dot); background: var(--bg); display: grid; place-items: center; font-size: 16px; }
.icon-btn:hover { background: var(--fg); color: var(--bg); }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; }
.bcard { border: 0; padding: 0; background: none; text-align: left; display: grid; gap: 8px; }
.bcard .mosaic {
  aspect-ratio: 1; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  background: var(--fg); border: 2px solid var(--fg); border-radius: var(--wob1); box-shadow: 3px 4px 0 var(--fg);
  transition: transform .2s ease, box-shadow .2s;
}
.bcard:nth-child(even) .mosaic { border-radius: var(--wob2); }
.bcard .mosaic img, .bcard .mosaic i { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--c, var(--bg)); }
.bcard .mosaic i:not([style*="#"]) { background: var(--hatch), var(--bg); }
.bcard:hover .mosaic { transform: translate(-2px, -2px) rotate(-1.5deg); box-shadow: 5px 6px 0 var(--fg); }
.bcard.current .mosaic { outline: 2px dashed var(--fg); outline-offset: 5px; }
.bcard b { font: 700 15px/1.25 var(--font-display); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .bm { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bcard small { font-size: 13px; color: var(--muted); }
.bcard .dots { display: flex; }
.bcard .dots i { width: 12px; height: 12px; border-radius: 50%; margin-left: -3px; border: 1.5px solid var(--fg); }
.bcard.new .mosaic { display: grid; place-items: center; grid-template-columns: 1fr; background: var(--bg); box-shadow: none; border-style: dashed; font: 300 48px var(--font-display); }
.sheet-foot { border-top: 2px dashed var(--fg); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
.danger-link { border: 0; background: none; color: var(--fg); padding: 0; white-space: nowrap; font-size: 14.5px; font-weight: 600; text-decoration: underline wavy; text-underline-offset: 4px; text-decoration-thickness: 1px; }

/* lightbox: one reference, framed on the page */
#lightbox {
  position: fixed; inset: 0; z-index: 70; color: var(--fg); display: grid; grid-template-rows: 1fr auto; overflow: hidden;
  background: radial-gradient(var(--faint) 1.2px, transparent 1.6px) 0 0 / 24px 24px, var(--bg);
}
.lb-stage { position: relative; z-index: 1; display: grid; place-items: center; padding: 60px 76px 14px; min-height: 0; }
.lb-stage img, .lb-stage video, .lb-stage iframe {
  max-width: 100%; max-height: calc(100vh - 200px); object-fit: contain; background: var(--bg);
  border: 2.5px solid var(--fg); border-radius: var(--wob1); box-shadow: 6px 8px 0 var(--fg);
  animation: pop .3s cubic-bezier(.2,.8,.2,1);
}
.lb-stage iframe { width: min(1100px, 100%); aspect-ratio: 16 / 9; background: #000; }
.lb-stage iframe.tall { width: auto; height: calc(100vh - 200px); aspect-ratio: 9 / 16; }
.lb-stage .linkcard { border: 2.5px solid var(--fg); border-radius: var(--wob1); box-shadow: 6px 8px 0 var(--fg); }
.lb-btn {
  position: absolute; z-index: 2; width: 48px; height: 48px; border: 2px solid var(--fg); border-radius: var(--wob-dot);
  background: var(--bg); color: var(--fg); font-size: 22px; display: grid; place-items: center; box-shadow: 2px 3px 0 var(--fg);
}
.lb-btn:hover { background: var(--fg); color: var(--bg); }
.lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
.lb-close { right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
.lb-meta {
  position: relative; z-index: 1; display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  padding: 14px max(20px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: 1120px; width: 100%; margin: 0 auto;
}
.lb-info { flex: 1; min-width: 220px; display: grid; gap: 10px; }
.lb-info .src { font-size: 14px; color: var(--muted); word-break: break-all; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const proxied = u => "/api/img?url=" + encodeURIComponent(u);

const state = { slug: "", name: "", items: [], cols: 4, motion: "hover", filter: "all", pending: 0 };
let boards = [];
const fresh = new Set();

let STATIC = false;

  "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Fronalpstock_big.jpg/960px-Fronalpstock_big.jpg",
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
  "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tour_Eiffel_Wikimedia_Commons.jpg/500px-Tour_Eiffel_Wikimedia_Commons.jpg",
  "https://vimeo.com/76979871",
  "https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/960px-The_Earth_seen_from_Apollo_17.jpg",
  "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg",
  "https://www.youtube.com/watch?v=aqz-KE-bpKQ",
  "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Clocktower_Panorama_20080622_20mb.jpg/960px-Clocktower_Panorama_20080622_20mb.jpg"

const blobURLs = new Map();
const srcOf = u => (u || "").startsWith("idb:") ? (blobURLs.get(u) || "") : (u || "");

const serverAPI = {
  list: async () => (await fetch("/api/boards")).json(),
  get: async slug => { const r = await fetch("/api/boards/" + slug); return r.ok ? r.json() : null; },
  put: (slug, b) => fetch("/api/boards/" + slug, { method: "PUT", body: JSON.stringify(b) }),
  del: slug => fetch("/api/boards/" + slug, { method: "DELETE" }),
  resolve: async urls => (await fetch("/api/resolve", { method: "POST", body: JSON.stringify({ urls }) })).json(),

const LS = "moodboard:";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(LS + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch { return false; } };
const idb = {
  db: null,
  open() {
    return this.db ||= new Promise((res, rej) => {
      const r = indexedDB.open("moodboard", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("media");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, blob) {
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction("media", "readwrite"); tx.objectStore("media").put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction("media").objectStore("media").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  }

async function hydrateBlobs(items) {
  await Promise.all(items.map(async it => {
    if (!(it.src || "").startsWith("idb:") || blobURLs.has(it.src)) return;
    try { const blob = await idb.get(it.src.slice(4)); if (blob) blobURLs.set(it.src, URL.createObjectURL(blob)); } catch {}

}
function coversOf(items) {

    const s = it.kind === "video" ? it.poster : (it.kind === "image" || it.kind === "embed" ? it.src : null);
    if (s) out.push(s);
    if (out.length === 4) break;

}

  await Promise.all(Array.from({ length: Math.min(n, list.length) }, async () => { while (i < list.length) { const k = i++; out[k] = await fn(list[k]); } }));

}
function parseCSV(text, delim = ",") {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }

}
const TAG_H = new Set(["tag", "tags", "group", "section", "category", "theme", "type", "mood"]);
const CAP_H = new Set(["caption", "note", "notes", "title", "description", "name", "label"]);
function rowsToEntries(rows) {
  rows = rows.filter(r => r.some(c => String(c).trim()));
  if (!rows.length) return [];
  let header = null;
  if (!rows[0].some(c => /https?:\/\//i.test(c))) { header = rows[0].map(c => String(c).trim().toLowerCase()); rows = rows.slice(1); }
  const out = [];
  for (const r of rows) {
    const urls = [], texts = []; let tag = "", caption = "";
    r.forEach((cell, i) => {
      cell = String(cell ?? "").trim();
      const found = cell.match(URL_RE);
      if (found) { urls.push(...found); return; }
      if (!cell) return;
      const col = header ? header[i] || "" : "";
      if (TAG_H.has(col) && !tag) tag = cell;
      else if (CAP_H.has(col) && !caption) caption = cell;
      else texts.push(cell);
    });
    caption = caption || texts.join(" · ");
    urls.forEach(url => out.push({ url, caption: caption.slice(0, 200), tag: tag.slice(0, 40) }));
  }

}
// Google blocks cross-site CSV reads, but its gviz endpoint can answer as a script (JSONP).
function sheetEntries(u) {
  const m = u.match(/\/spreadsheets\/d\/(e\/)?([\w-]+)/);
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  const fail = new Error("This sheet isn't public. In Google Sheets: Share → General access → Anyone with the link → Viewer, then drop the link again.");
  if (!m || m[1]) return Promise.reject(m ? new Error("“Publish to web” links only work in the local version. Paste the sheet's normal Share link instead.") : fail);
  return new Promise((res, rej) => {
    const cb = "__moodSheet" + Date.now().toString(36);
    const s = document.createElement("script");
    const cleanup = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { cleanup(); rej(fail); }, 12000);
    window[cb] = data => {
      cleanup();
      if (!data || data.status === "error" || !data.table) return rej(fail);
      const labels = data.table.cols.map(c => c.label || "");
      const rows = data.table.rows.map(r => (r.c || []).map(c => c ? String(c.v ?? c.f ?? "") : ""));
      if (labels.some(Boolean)) rows.unshift(labels);
      res(rowsToEntries(rows));
    };
    s.onerror = () => { cleanup(); rej(fail); };
    s.src = `https://docs.google.com/spreadsheets/d/${m[2]}/gviz/tq?tqx=responseHandler:${cb}${gid ? "&gid=" + gid : ""}`;
    document.head.appendChild(s);
  });
}
function probeImage(u) {
  return new Promise(res => {
    const i = new Image();
    const t = setTimeout(() => res(null), 8000);
    i.referrerPolicy = "no-referrer";
    i.onload = () => { clearTimeout(t); res([i.naturalWidth, i.naturalHeight]); };
    i.onerror = () => { clearTimeout(t); res(null); };
    i.src = u;
  });
}
async function resolveInBrowser(url) {
  const u = url.replace(/[.]+$/, "");
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) {
    const tall = u.includes("/shorts/");
    return { kind: "embed", url: u, src: `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`, embed: `https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0`, provider: "YouTube", w: tall ? 9 : 16, h: tall ? 16 : 9 };
  }
  m = u.match(/vimeo\.com\/(?:video\/|channels\/[\w-]+\/)?(\d+)/);
  if (m) {
    try {
      const o = await (await fetch("https://vimeo.com/api/oembed.json?width=1280&url=" + encodeURIComponent(u))).json();
      return { kind: "embed", url: u, src: o.thumbnail_url, embed: `https://player.vimeo.com/video/${m[1]}?autoplay=1`, title: o.title, provider: "Vimeo", w: o.width, h: o.height };
    } catch {}
  }
  m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/);
  if (m) return { kind: "embed", url: u, src: `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`, embed: `https://drive.google.com/file/d/${m[1]}/preview`, provider: "Drive" };

  try { const p = new URL(u); path = p.pathname; host = p.host.replace(/^www\./, ""); } catch {}
  if (/dropbox\.com$/.test(host) && (IMG_EXT.test(path) || VID_EXT.test(path))) {
    const raw = u.replace(/[?&]dl=\d/, "");
    return { kind: VID_EXT.test(path) ? "video" : "image", url: u, src: raw + (raw.includes("?") ? "&" : "?") + "raw=1", provider: "Dropbox" };
  }
  if (IMG_EXT.test(path)) return { kind: "image", url: u, src: u };
  if (VID_EXT.test(path)) return { kind: "video", url: u, src: u };

  if (dims) return { kind: "image", url: u, src: u, w: dims[0], h: dims[1] };

}
async function resolveEntriesInBrowser(entries, notes = []) {
  const items = await mapLimit(entries, 6, async e => {
    const d = await resolveInBrowser(e.url);
    if (e.caption) d.caption = e.caption;
    if (e.tag) d.tag = e.tag;
    return d;
  });
  const pages = items.filter(i => i.kind === "link").length;
  if (pages) notes.push(`${pages} page link${pages > 1 ? "s" : ""} (like Pinterest or Behance) need the local version to find the image. Drag the image itself in instead.`);
  return { items, notes };
}
const staticAPI = {
  async list() {
    return (lsGet("index") || []).map(slug => {
      const b = lsGet("board:" + slug);
      return b && { slug, name: b.name || "Untitled board", count: (b.items || []).length, covers: coversOf(b.items || []), palette: (b.palette || []).slice(0, 6), updated: b.updated || 0 };
    }).filter(Boolean).sort((a, b) => b.updated - a.updated);
  },
  async get(slug) { return lsGet("board:" + slug); },
  async put(slug, b) {
    b.updated = Date.now();
    const idx = lsGet("index") || [];
    if (!idx.includes(slug)) { idx.push(slug); lsSet("index", idx); }
    if (!lsSet("board:" + slug, b)) toast("This browser's storage is full or blocked, so the board couldn't be saved.");
  },
  async del(slug) {
    lsSet("index", (lsGet("index") || []).filter(s => s !== slug));
    try { localStorage.removeItem(LS + "board:" + slug); } catch {}
  },
  async resolve(urls) {
    const entries = [], notes = [];
    for (const u of urls) {
      if (!u.includes("docs.google.com/spreadsheets")) { entries.push({ url: u }); continue; }
      try { const got = await sheetEntries(u); entries.push(...got); notes.push(`Read ${got.length} links from the sheet.`); }
      catch (e) { notes.push(e.message); }
    }
    return resolveEntriesInBrowser(entries, notes);
  },
  async upload(f) {
    const ext = ((f.name.match(/\.[^.]+$/) || [""])[0]).toLowerCase();
    if ([".csv", ".tsv", ".txt"].includes(ext)) {
      const entries = rowsToEntries(parseCSV(await f.text(), ext === ".tsv" ? "\t" : ","));
      return resolveEntriesInBrowser(entries, [`Read ${entries.length} links from ${f.name}.`]);
    }
    if (ext === ".xlsx") return { items: [], notes: ["Excel files need the local version. Export the sheet as CSV and drop that instead."] };
    if (IMG_EXT.test(f.name) || VID_EXT.test(f.name)) {
      const key = "idb:m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      try { await idb.put(key.slice(4), f); } catch { return { items: [], notes: [`Couldn't store ${f.name} in this browser.`] }; }

let api = serverAPI;

/* ---------------- color */
const hexOf = ([r, g, b]) => "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");

const dist = (a, b) => Math.hypot(a[0] - b[0], (a[1] - b[1]) * 1.2, a[2] - b[2]);

function quantize(el, w, h, cropBars) {

  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(el, 0, sy, w, sh, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  const buckets = new Map(); let total = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 128) continue;
    const k = (d[i] >> 4) << 8 | (d[i + 1] >> 4) << 4 | (d[i + 2] >> 4);
    const e = buckets.get(k) || [0, 0, 0, 0];

    buckets.set(k, e); total++;

function colorSource(it) {

  if (it.kind === "video") return it.poster || (local(it.src) ? it.src : null);
  return null;
}

/* ---------------- adding */

function addItems(newItems) {

  state.items.push(...added);

async function addLinks(text) {

  const sheets = urls.some(u => u.includes("docs.google.com/spreadsheets"));
  state.pending += sheets ? Math.max(urls.length, 6) : urls.length;
  render();
  $("#addBtn").disabled = true;
  try {
    const res = await api.resolve(urls);
    state.pending = 0;

$("#motion").addEventListener("change", e => { state.motion = e.target.value; render(); save(); });
$("#boardName").addEventListener("input", e => { state.name = e.target.value.trim() || "Untitled board"; document.title = state.name + " · Moodboard"; save(); });
$("#boardName").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#newBoard").onclick = newBoard;
$("#openBoards").onclick = () => { renderBoards(); $("#boardsPanel").hidden = false; };
$("#closeBoards").onclick = () => ($("#boardsPanel").hidden = true);
$("#boardsPanel").addEventListener("click", e => {
  if (e.target.id === "boardsPanel") { $("#boardsPanel").hidden = true; return; }
  const card = e.target.closest(".bcard");
  if (!card) return;
  if (card.dataset.new !== undefined) return newBoard(e);
  $("#boardsPanel").hidden = true;
  if (card.dataset.slug !== state.slug) openBoard(card.dataset.slug);
});
$("#copyLinks").onclick = () => {
  const links = state.items.map(it => it.url).filter(u => /^https?:/.test(u));
  copyText(links.join("\n"), `Copied ${links.length} links.`);
};
let delArmed = false;
$("#deleteBoard").onclick = async () => {
  const b = $("#deleteBoard");
  if (!delArmed) { delArmed = true; b.textContent = "Click again to delete"; setTimeout(() => { delArmed = false; b.textContent = "Delete this board"; }, 3000); return; }
  delArmed = false; b.textContent = "Delete this board";
  await api.del(state.slug);
  $("#boardsPanel").hidden = true;
  await refreshBoardList();
  if (boards.length) openBoard(boards[0].slug); else newBoard();
  toast("Board deleted. Files you dropped stay in the media folder.");
};
/* light / dark: follows the system until you pick one, then remembers it in this browser */
const SUN = `<svg class="ink-svg" viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#rough)"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>`;
const MOON = `<svg class="ink-svg" viewBox="0 0 24 24" aria-hidden="true"><path filter="url(#rough)" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`;
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light")) === "dark";
function paintThemeBtn() {
  const d = isDark(), label = d ? "Switch to light mode" : "Switch to dark mode";
  $("#themeBtn").innerHTML = d ? `${SUN}Light` : `${MOON}Dark`;
  $("#themeBtn").setAttribute("aria-label", label);
  $("#themeBtn").title = label;
}
$("#themeBtn").onclick = () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  store.set("moodboard:theme", t);
  paintThemeBtn();
};
darkQuery.addEventListener("change", paintThemeBtn);
paintThemeBtn();
window.addEventListener("resize", relayoutSoon);
new IntersectionObserver(([e]) => $("#toolbar").classList.toggle("stuck", e.intersectionRatio === 0)).observe($(".masthead"));

/* ---------------- paste & drop anywhere */
document.addEventListener("paste", e => {
  if (e.target.closest("input, textarea")) {
    if (e.target.id !== "linkInput" || !e.clipboardData.files.length) return;
  }
  if (e.clipboardData.files.length) { e.preventDefault(); uploadFiles(e.clipboardData.files); return; }
  const text = e.clipboardData.getData("text");
  URL_RE.lastIndex = 0;
  if (URL_RE.test(text)) { e.preventDefault(); addLinks(text); }
  URL_RE.lastIndex = 0;
});
let dragDepth = 0;
const external = e => !e.dataTransfer.types.includes("application/x-mood-id");
document.addEventListener("dragenter", e => { if (!external(e)) return; dragDepth++; $("#dropzone").hidden = false; });
document.addEventListener("dragleave", e => { if (!external(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#dropzone").hidden = true; } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0; $("#dropzone").hidden = true;
  if (!external(e)) return;
  const dt = e.dataTransfer;
  if (dt.files.length) return uploadFiles(dt.files);
  const htmlData = dt.getData("text/html");
  const img = htmlData && htmlData.match(/<img[^>]+src=["']([^"']+)["']/i);
  if (img && /^https?:/.test(img[1])) return addLinks(img[1].replace(/&amp;/g, "&"));
  const text = dt.getData("text/uri-list") || dt.getData("text/plain");
  if (text) addLinks(text);
});

/* ---------------- boot */
(async function boot() {
  try {
    const list = await serverAPI.list();
    if (!Array.isArray(list)) throw new Error("no server");
  } catch {
    // No server.py behind this page (GitHub Pages, or opened as a file): work in the browser alone
    STATIC = true;
    api = staticAPI;
    $("#storageNote").textContent = "Boards save in this browser only. Run the local version to save them as files and read Pinterest-style links.";
  }
  await refreshBoardList();
  const last = store.get("moodboard:last");
  if (boards.some(b => b.slug === last)) openBoard(last);
  else if (boards.length) openBoard(boards[0].slug);
  else newBoard();
})();
</script>
</body>
</html>
